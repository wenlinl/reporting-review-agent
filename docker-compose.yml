name: shike

services:
  app:
    build: .
    container_name: shike-app-1
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env
    environment:
      DATABASE_URL: "file:/app/data/app.db"
    volumes:
      - app-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  app-data:
    name: shike_app-data # 沿用现有数据卷，避免部署时丢失生产数据
