# 食刻 (ShiKe) - 主域名 shike.live（tuvmkt.com 已下线，不再代理）
server {
    server_name shike.live www.shike.live;
    client_max_body_size 300m;

    # 安全响应头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(self)" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self' data:; media-src 'self' blob:" always;

    location = /63d41b84fd9055edc123666022cc4382.txt { root /opt/shike/public; }
    location = /shike-web.html { root /opt/shike/public; }
    location = /shike-h5.html { root /opt/shike/public; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/shike.live/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/shike.live/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# shike.live HTTP -> HTTPS
server {
    listen 80;
    server_name shike.live www.shike.live;
    return 301 https://shike.live$request_uri;
}
