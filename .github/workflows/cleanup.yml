name: Cleanup

on:
  workflow_dispatch:

jobs:
  free:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 释放服务器磁盘
        env:
          SSH_HOST: ${{ secrets.SHIKE_SSH_HOST }}
          SSH_PORT: ${{ secrets.SHIKE_SSH_PORT }}
          SSH_USER: ${{ secrets.SHIKE_SSH_USER }}
          SSH_KEY: ${{ secrets.SHIKE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=accept-new -o IdentitiesOnly=yes \
            "$SSH_USER@$SSH_HOST" \
            "echo '===DF_BEFORE==='; df -h / | tail -1; \
             echo '===DOCKER_DF==='; docker system df; \
             echo '===PRUNE==='; docker system prune -af; docker builder prune -af; \
             echo '===DF_AFTER==='; df -h / | tail -1"
